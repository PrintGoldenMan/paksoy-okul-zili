# Tören seslerini (İstiklal Marşı, Saygı Duruşu + İstiklal Marşı) YouTube'dan indirip Opus'a çevirir ve
# «toren_kaynak/» klasörüne kaydeder. Program bu dosyalardan okul_zili/gomulu_sesler.py modülünü üretir
# (tools/gomulu_sesler_olustur.py). Yalnızca Actions sekmesinden elle çalıştırılır.
name: Tören sesleri

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Araçları kur
        run: pip install -U yt-dlp yt-dlp-ejs imageio-ffmpeg

      - name: İndir ve Opus'a çevir
        run: |
          set -e
          FFMPEG=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p toren_kaynak tmp
          download() {
            name=$1; url=$2
            yt-dlp --no-playlist -f bestaudio -o "tmp/$name.%(ext)s" --print-json "$url" > "tmp/$name.json" \
              || yt-dlp --no-playlist -f bestaudio --extractor-args "youtube:player_client=tv,web_safari" \
                   -o "tmp/$name.%(ext)s" --print-json "$url" > "tmp/$name.json"
            src=$(ls tmp/$name.* | grep -v json | head -1)
            # Ses düzeyi eşitlenmez, sessizlik kırpılmaz: kayıt olduğu gibi, yüksek kaliteli Opus (128 kb/sn).
            "$FFMPEG" -hide_banner -loglevel error -y -i "$src" -vn -ar 48000 -ac 2 -c:a libopus -b:a 128k \
              -f opus "toren_kaynak/$name.opus"
            python - "$name" <<'EOF'
          import json, sys
          name = sys.argv[1]
          info = json.load(open(f"tmp/{name}.json"))
          meta = {k: info.get(k) for k in ("id", "title", "uploader", "channel", "duration", "webpage_url",
                                           "license", "abr", "acodec")}
          json.dump(meta, open(f"toren_kaynak/{name}.json", "w"), ensure_ascii=False, indent=2)
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          EOF
          }
          download istiklal "https://youtu.be/s3GnMgOQs5k"
          download saygi "https://youtu.be/PMhKP8QyxFQ"
          ls -la toren_kaynak

      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toren_kaynak
          git commit -m "Tören sesleri indirildi (Actions)" || echo "Değişiklik yok"
          git push
