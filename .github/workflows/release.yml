# Windows kurulum programını, taşınabilir .exe'yi ve Linux paketini derleyip GitHub sürümü (Release)
# olarak yayınlar. Tetikleme: "v1.2.3" biçiminde bir etiket (tag) gönderildiğinde ya da Actions sekmesinden
# «Run workflow» ile elle (bu durumda etiket okul_zili/__init__.py içindeki sürümden oluşturulur).
name: Windows sürümü

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Derledikten sonra GitHub sürümü (Release) olarak yayınla"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürüm numarasını belirle
        id: ver
        shell: pwsh
        run: |
          $code = (Select-String -Path okul_zili/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tag -ne $code) { throw "Etiket ($tag) ile okul_zili/__init__.py sürümü ($code) aynı değil" }
          }
          "version=$code" >> $env:GITHUB_OUTPUT

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -v

      - name: Programı derle (kurulum için klasör)
        run: >
          pyinstaller --noconfirm --clean --windowed --name OkulZili
          --icon assets/okul_zili.ico --add-data "assets;assets"
          --collect-data customtkinter --collect-all edge_tts
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --copy-metadata yt-dlp
          --collect-submodules pystray --collect-submodules pycaw --hidden-import pycaw.pycaw
          --collect-submodules pyttsx3 --collect-submodules comtypes
          --hidden-import comtypes.stream --hidden-import win32com.client --hidden-import pythoncom --hidden-import PIL.ImageTk
          main.py

      - name: Taşınabilir tek dosya derle
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OkulZili-Tasinabilir-${{ steps.ver.outputs.version }}
          --icon assets/okul_zili.ico --add-data "assets;assets"
          --collect-data customtkinter --collect-all edge_tts
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --copy-metadata yt-dlp
          --collect-submodules pystray --collect-submodules pycaw --hidden-import pycaw.pycaw
          --collect-submodules pyttsx3 --collect-submodules comtypes
          --hidden-import comtypes.stream --hidden-import win32com.client --hidden-import pythoncom --hidden-import PIL.ImageTk
          main.py

      - name: Derlenen program açılıyor mu?
        shell: pwsh
        run: |
          # Programı birkaç saniye çalıştırıp çökmeden açık kaldığını doğrula.
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"; New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process -FilePath dist\OkulZili\OkulZili.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Program açıldıktan hemen sonra kapandı (çıkış kodu $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:APPDATA\OkulZili\kayit.log" -ErrorAction SilentlyContinue

      - name: İndirme ve ses parçaları paketlenmiş mi? (yt-dlp, ffmpeg, Opus)
        shell: pwsh
        run: |
          foreach ($exe in @("dist\OkulZili\OkulZili.exe", "dist\OkulZili-Tasinabilir-${{ steps.ver.outputs.version }}.exe")) {
            $out = "$env:RUNNER_TEMP\selftest.json"
            Remove-Item $out -ErrorAction SilentlyContinue
            $env:SDL_AUDIODRIVER = "dummy"
            $p = Start-Process -FilePath $exe -ArgumentList "--oz-selftest", $out -PassThru -Wait
            Get-Content $out
            if ($p.ExitCode -ne 0) { throw "$exe öz denetimi başarısız" }
          }

      - name: Kurulum programını derle (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\OkulZili.iss

      - name: Derlenen dosyaları sakla
        uses: actions/upload-artifact@v4
        with:
          name: OkulZili-${{ steps.ver.outputs.version }}
          path: |
            dist/OkulZili-Kurulum-*.exe
            dist/OkulZili-Tasinabilir-*.exe

  # Linux: tek dosyalık program + kurulum betiği (.tar.gz). Ubuntu 24.04'te derlenir; Lubuntu/Ubuntu
  # 24.04 ve sonrası (26.04 dahil) ile aynı ya da daha yeni glibc'li dağıtımlarda çalışır.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürüm numarası
        id: ver
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' okul_zili/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: Sistem paketleri (sanal ekran, renkli emoji yazı tipi – çizim denetimi için)
        run: >
          sudo apt-get update -q && sudo apt-get install -y -q xvfb xauth fonts-noto-color-emoji espeak-ng
          gir1.2-ayatanaappindicator3-0.1 libgirepository-2.0-dev libcairo2-dev pkg-config

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # Linux tepsi simgesi (StatusNotifierItem / AppIndicator) için; pakete gömülür.
          pip install PyGObject

      - name: Testleri çalıştır (arayüz testleri sanal ekranda)
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Programı derle (tek dosya)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name okulzili
          --add-data "assets:assets"
          --collect-data customtkinter --collect-all edge_tts
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg --copy-metadata yt-dlp
          --collect-submodules pystray --hidden-import PIL.ImageTk --hidden-import PIL._tkinter_finder
          --hidden-import gi.repository.AyatanaAppIndicator3 --collect-submodules gi
          main.py

      - name: Öz denetim ve açılış denemesi (sanal ekranda)
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          xvfb-run -a ./dist/okulzili --oz-selftest "$RUNNER_TEMP/selftest.json" || { cat "$RUNNER_TEMP/selftest.json"; exit 1; }
          cat "$RUNNER_TEMP/selftest.json"
          # Programı 15 saniye çalıştırıp çökmeden açık kaldığını doğrula.
          xvfb-run -a sh -c './dist/okulzili & pid=$!; sleep 15; kill -0 $pid || exit 1; kill $pid' \
            || { cat "$HOME/.local/share/OkulZili/kayit.log"; echo "Program açıldıktan hemen sonra kapandı"; exit 1; }
          tail -n 20 "$HOME/.local/share/OkulZili/kayit.log" || true

      - name: Paketle
        run: |
          V=${{ steps.ver.outputs.version }}
          P=OkulZili-Linux-$V
          mkdir -p "$P"
          cp dist/okulzili "$P/okulzili"
          cp installer/linux/kur.sh installer/linux/BENIOKU.txt "$P/"
          cp assets/okul_zili.png "$P/okulzili.png"
          chmod +x "$P/okulzili" "$P/kur.sh"
          test "$("$P/okulzili" --version)" = "$V"   # kur.sh sürümü böyle okur
          (cd "$P" && sha256sum okulzili okulzili.png > SHA256SUMS)
          tar czf "dist/OkulZili-Linux-x86_64-$V.tar.gz" "$P"
          ls -la dist

      - name: Derlenen dosyaları sakla
        uses: actions/upload-artifact@v4
        with:
          name: OkulZili-Linux-${{ steps.ver.outputs.version }}
          path: dist/OkulZili-Linux-*.tar.gz

  publish:
    needs: [build, linux]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      # Elle çalıştırmada yayınlanmış bir sürümün dosyaları aynı etiketle sessizce değiştirilmesin.
      - name: Bu sürüm daha önce yayınlanmış mı?
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v$VERSION sürümü zaten yayınlanmış. Yayınlanmış dosyalar değiştirilmez; önce okul_zili/__init__.py içindeki sürüm numarasını artırın."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: GitHub sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Okul Zili ${{ needs.build.outputs.version }}
          body_path: installer/SURUM_NOTLARI.md
          files: |
            dist/OkulZili-Kurulum-*.exe
            dist/OkulZili-Tasinabilir-*.exe
            dist/OkulZili-Linux-*.tar.gz
