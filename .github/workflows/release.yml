# Windows kurulum programını ve taşınabilir .exe'yi derleyip GitHub sürümü (Release) olarak yayınlar.
# Tetikleme: "v1.2.3" biçiminde bir etiket (tag) gönderildiğinde ya da Actions sekmesinden
# «Run workflow» ile elle (bu durumda etiket okul_zili/__init__.py içindeki sürümden oluşturulur).
name: Windows sürümü

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Derledikten sonra GitHub sürümü (Release) olarak yayınla"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sürüm numarasını belirle
        id: ver
        shell: pwsh
        run: |
          $code = (Select-String -Path okul_zili/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tag -ne $code) { throw "Etiket ($tag) ile okul_zili/__init__.py sürümü ($code) aynı değil" }
          }
          "version=$code" >> $env:GITHUB_OUTPUT

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -v

      - name: Programı derle (kurulum için klasör)
        run: >
          pyinstaller --noconfirm --clean --windowed --name OkulZili
          --icon assets/okul_zili.ico --add-data "assets;assets"
          --collect-data customtkinter --collect-all edge_tts
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg
          --collect-submodules pyttsx3 --collect-submodules comtypes
          --hidden-import comtypes.stream --hidden-import win32com.client --hidden-import pythoncom
          main.py

      - name: Taşınabilir tek dosya derle
        run: >
          pyinstaller --noconfirm --onefile --windowed --name OkulZili-Tasinabilir-${{ steps.ver.outputs.version }}
          --icon assets/okul_zili.ico --add-data "assets;assets"
          --collect-data customtkinter --collect-all edge_tts
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all imageio_ffmpeg
          --collect-submodules pyttsx3 --collect-submodules comtypes
          --hidden-import comtypes.stream --hidden-import win32com.client --hidden-import pythoncom
          main.py

      - name: Derlenen program açılıyor mu?
        shell: pwsh
        run: |
          # Programı birkaç saniye çalıştırıp çökmeden açık kaldığını doğrula.
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"; New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $p = Start-Process -FilePath dist\OkulZili\OkulZili.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Program açıldıktan hemen sonra kapandı (çıkış kodu $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Get-Content "$env:APPDATA\OkulZili\kayit.log" -ErrorAction SilentlyContinue

      - name: İndirme ve ses parçaları paketlenmiş mi? (yt-dlp, ffmpeg, Opus)
        shell: pwsh
        run: |
          foreach ($exe in @("dist\OkulZili\OkulZili.exe", "dist\OkulZili-Tasinabilir-${{ steps.ver.outputs.version }}.exe")) {
            $out = "$env:RUNNER_TEMP\selftest.json"
            Remove-Item $out -ErrorAction SilentlyContinue
            $env:SDL_AUDIODRIVER = "dummy"
            $p = Start-Process -FilePath $exe -ArgumentList "--oz-selftest", $out -PassThru -Wait
            Get-Content $out
            if ($p.ExitCode -ne 0) { throw "$exe öz denetimi başarısız" }
          }

      - name: Kurulum programını derle (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.ver.outputs.version }} installer\OkulZili.iss

      - name: Derlenen dosyaları sakla
        uses: actions/upload-artifact@v4
        with:
          name: OkulZili-${{ steps.ver.outputs.version }}
          path: |
            dist/OkulZili-Kurulum-*.exe
            dist/OkulZili-Tasinabilir-*.exe

      - name: GitHub sürümü yayınla
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Okul Zili ${{ steps.ver.outputs.version }}
          body_path: installer/SURUM_NOTLARI.md
          files: |
            dist/OkulZili-Kurulum-*.exe
            dist/OkulZili-Tasinabilir-*.exe
